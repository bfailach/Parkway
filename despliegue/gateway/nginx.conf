# =====================================================================
# API Gateway de Parkway (Nginx)
# Punto único de entrada al sistema distribuido:
#   - Balancea la carga entre las réplicas del backend (round robin).
#   - Saca de rotación una réplica caída y reintenta en otra (failover).
#   - Enruta /eventos al microservicio de eventos.
#   - Mantiene las conexiones WebSocket del tiempo real.
#   - Limita peticiones por IP (protección contra fuerza bruta y abuso).
#   - Agrega cabeceras de seguridad y un identificador por petición.
# =====================================================================
worker_processes auto;
events { worker_connections 2048; }

http {
  # Docker resuelve los nombres de servicio; se vuelven a consultar cada 10 s.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format gateway '$remote_addr "$request" $status ${request_time}s '
                     'nodo=$upstream_http_x_parkway_nodo upstream=$upstream_addr id=$request_id';
  access_log /dev/stdout gateway;
  error_log  /dev/stderr warn;

  # Límites de peticiones por IP. Las pruebas de carga corren en el mismo
  # equipo del gateway (127.0.0.1) y simulan cientos de usuarios desde una
  # sola IP, así que esa dirección queda exenta; cualquier otra se limita.
  geo $exento_limite { default 0; 127.0.0.1 1; }
  map $exento_limite $llave_limite { 0 $binary_remote_addr; 1 ""; }
  limit_req_zone $llave_limite zone=api:10m   rate=30r/s;
  limit_req_zone $llave_limite zone=login:10m rate=10r/m;
  limit_req_status 429;

  # Réplicas del backend. Tras 2 fallos, una réplica sale de rotación 10 s.
  upstream backend {
    server api1:3000 max_fails=2 fail_timeout=10s;
    server api2:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-Id $request_id always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;

    # Si una réplica no responde, la petición pasa a la otra. Nginx nunca
    # reenvía un POST que ya llegó a una réplica, así que no duplica ingresos.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # Inicio de sesión: límite estricto contra fuerza bruta.
    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_set_header Connection "";
      proxy_pass http://backend;
    }

    # Tiempo real (WebSocket).
    location = /api/tiempo-real {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_pass http://backend;
    }

    # Microservicio de eventos (dos réplicas detrás del mismo nombre).
    location /eventos/ {
      limit_req zone=api burst=60 nodelay;
      set $eventos http://eventos:4000;
      proxy_set_header Connection "";
      proxy_pass $eventos;
    }

    # Estado del propio gateway.
    location = /gateway/salud {
      default_type application/json;
      return 200 '{"gateway":"ok"}';
    }

    # API REST y aplicación web.
    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_set_header Connection "";
      proxy_pass http://backend;
    }
  }
}

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <title>Parkway</title>
    <script>
      // Aplica el tema y el tamaño de letra guardados antes de pintar la página.
      try {
        var a = JSON.parse(localStorage.getItem("parkway.apariencia") || "{}");
        document.documentElement.dataset.theme = a.tema === "claro" ? "light" : "dark";
        document.documentElement.dataset.texto = a.texto || "normal";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
